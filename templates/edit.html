<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать клиента</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; text-align: center; }
        label { font-weight: 600; font-size: 0.9em; color: #555; display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        .form-row { display: flex; gap: 15px; }
        .form-row > div { flex: 1; }
        .btn { background: #3498db; color: white; padding: 15px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1em; transition: 0.3s; }
        .btn:hover { background: #2980b9; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; }
        .back-link:hover { color: #3498db; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Редактировать клиента</h2>
        <form action="/update/{{ client['id'] }}" method="post">
            <div class="form-row">
                <div><label>Фамилия *</label><input type="text" name="last_name" value="{{ client['last_name'] }}" required></div>
                <div><label>Имя *</label><input type="text" name="first_name" value="{{ client['first_name'] }}" required></div>
            </div>
            
            <div class="form-row">
                <div><label>Дата оплаты *</label><input type="date" name="payment_date" value="{{ client['payment_date'] }}" required></div>
                <div><label>Дата первой тренировки</label><input type="date" name="first_training_date" value="{{ client['first_training_date'] if client['first_training_date'] else '' }}"></div>
            </div>

            <div class="form-row">
                <div><label>Дата окончания *</label><input type="date" name="subscription_end_date" value="{{ client['subscription_end_date'] }}" required></div>
                <div><label>Сумма (AZN) *</label><input type="number" step="0.01" name="amount" value="{{ client['amount'] }}" required></div>
            </div>

            <div class="form-row">
                <div><label>Телефон *</label><input type="text" name="phone" value="{{ client['phone'] }}" required></div>
                <div><label>День рождения</label><input type="date" name="birthday" value="{{ client['birthday'] if client['birthday'] else '' }}"></div>
            </div>
            
            <label>Примечание</label>
            <textarea name="notes" rows="2">{{ client['notes'] if client['notes'] else '' }}</textarea>
            
            <label>Тип абонемента *</label>
            <select name="subscription_type" onchange="toggleFields()">
                <option value="Абонемент" {% if client['subscription_type'] == "Абонемент" %}selected{% endif %}>Абонемент</option>
                <option value="Персональные тренировки" {% if client['subscription_type'] == "Персональные тренировки" %}selected{% endif %}>Персональные тренировки</option>
            </select>
            
            <div id="personalFields" {% if client['subscription_type'] != "Персональные тренировки" %}class="hidden"{% endif %}>
                <div class="form-row">
                    <div><label>Тренер</label><input type="text" name="trainer" value="{{ client['trainer'] if client['trainer'] else '' }}"></div>
                    <div><label>Количество тренировок</label><input type="number" name="sessions_total" value="{{ client['sessions_total'] if client['sessions_total'] else 8 }}"></div>
                </div>
                <label>Дни недели (через запятую)</label>
                <input type="text" name="training_days" value="{{ client['training_days'] if client['training_days'] else '' }}" placeholder="Пн, Ср, Пт">
            </div>
            
            <button type="submit" class="btn">Сохранить изменения</button>
        </form>
        <a href="/" class="back-link">← Вернуться к списку</a>
    </div>

    <script>
        function toggleFields() {
            var type = document.querySelector('select[name="subscription_type"]').value;
            var personalFields = document.getElementById('personalFields');
            if (type === "Персональные тренировки") { personalFields.classList.remove('hidden'); } 
            else { personalFields.classList.add('hidden'); }
        }
    </script>
</body>
</html>
